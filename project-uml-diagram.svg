<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #374151; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .box-text { font: 14px Arial, sans-serif; fill: #1f2937; }
      .stereo { font: italic 13px Arial, sans-serif; fill: #4b5563; }
      .edge { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#f9fafb"/>
  <text x="800" y="50" text-anchor="middle" class="title">UML Component Diagram — Flower Classification Project</text>
  <text x="800" y="80" text-anchor="middle" class="subtitle">Use-CNNs-to-classify-flowers-based-on-their-features-like-color-and-shape-using-computer-vision-demo</text>

  <!-- Client layer -->
  <rect x="60" y="130" width="460" height="780" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="290" y="165" text-anchor="middle" class="box-title">Frontend (client/src)</text>

  <rect x="95" y="195" width="390" height="130" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="290" y="220" text-anchor="middle" class="stereo">&lt;&lt;component&gt;&gt;</text>
  <text x="290" y="245" text-anchor="middle" class="box-title">App / Router</text>
  <text x="290" y="270" text-anchor="middle" class="box-text">App.tsx</text>
  <text x="290" y="292" text-anchor="middle" class="box-text">Routes: /, /architecture</text>

  <rect x="95" y="350" width="390" height="140" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="290" y="375" text-anchor="middle" class="stereo">&lt;&lt;component&gt;&gt;</text>
  <text x="290" y="400" text-anchor="middle" class="box-title">Home + UploadZone</text>
  <text x="290" y="425" text-anchor="middle" class="box-text">Image upload UI</text>
  <text x="290" y="447" text-anchor="middle" class="box-text">Displays species, metrics,</text>
  <text x="290" y="469" text-anchor="middle" class="box-text">phytochemicals, geography</text>

  <rect x="95" y="515" width="390" height="145" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="290" y="540" text-anchor="middle" class="stereo">&lt;&lt;hook&gt;&gt;</text>
  <text x="290" y="565" text-anchor="middle" class="box-title">useAnalyze / usePrediction</text>
  <text x="290" y="590" text-anchor="middle" class="box-text">use-predictions.ts</text>
  <text x="290" y="612" text-anchor="middle" class="box-text">POST /api/predict</text>
  <text x="290" y="634" text-anchor="middle" class="box-text">GET /api/predictions/:id</text>

  <rect x="95" y="685" width="390" height="190" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="290" y="710" text-anchor="middle" class="stereo">&lt;&lt;component&gt;&gt;</text>
  <text x="290" y="735" text-anchor="middle" class="box-title">ArchitectureView</text>
  <text x="290" y="760" text-anchor="middle" class="box-text">Pipeline visualization page</text>
  <text x="290" y="782" text-anchor="middle" class="box-text">(reference architecture)</text>

  <!-- Server layer -->
  <rect x="570" y="130" width="500" height="780" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="820" y="165" text-anchor="middle" class="box-title">Backend API (server)</text>

  <rect x="610" y="195" width="420" height="135" rx="10" fill="#ffffff" stroke="#06b6d4" stroke-width="1.8"/>
  <text x="820" y="220" text-anchor="middle" class="stereo">&lt;&lt;component&gt;&gt;</text>
  <text x="820" y="245" text-anchor="middle" class="box-title">Express Server</text>
  <text x="820" y="270" text-anchor="middle" class="box-text">index.ts</text>
  <text x="820" y="292" text-anchor="middle" class="box-text">JSON parser, logging, error middleware</text>

  <rect x="610" y="355" width="420" height="170" rx="10" fill="#ffffff" stroke="#06b6d4" stroke-width="1.8"/>
  <text x="820" y="380" text-anchor="middle" class="stereo">&lt;&lt;component&gt;&gt;</text>
  <text x="820" y="405" text-anchor="middle" class="box-title">registerRoutes()</text>
  <text x="820" y="430" text-anchor="middle" class="box-text">routes.ts</text>
  <text x="820" y="452" text-anchor="middle" class="box-text">POST /api/predict</text>
  <text x="820" y="474" text-anchor="middle" class="box-text">GET /api/predictions/:id</text>
  <text x="820" y="496" text-anchor="middle" class="box-text">Input validation + response mapping</text>

  <rect x="610" y="550" width="420" height="175" rx="10" fill="#ffffff" stroke="#06b6d4" stroke-width="1.8"/>
  <text x="820" y="575" text-anchor="middle" class="stereo">&lt;&lt;service&gt;&gt;</text>
  <text x="820" y="600" text-anchor="middle" class="box-title">analyzeWithGemini()</text>
  <text x="820" y="625" text-anchor="middle" class="box-text">calls Gemini API</text>
  <text x="820" y="647" text-anchor="middle" class="box-text">parses/normalizes JSON response</text>
  <text x="820" y="669" text-anchor="middle" class="box-text">local fallback analysis when needed</text>
  <text x="820" y="691" text-anchor="middle" class="box-text">throws NonFlowerImageError</text>

  <rect x="610" y="750" width="420" height="125" rx="10" fill="#ffffff" stroke="#06b6d4" stroke-width="1.8"/>
  <text x="820" y="775" text-anchor="middle" class="stereo">&lt;&lt;component&gt;&gt;</text>
  <text x="820" y="800" text-anchor="middle" class="box-title">Storage</text>
  <text x="820" y="825" text-anchor="middle" class="box-text">storage.ts</text>
  <text x="820" y="847" text-anchor="middle" class="box-text">No database persistence (stub)</text>

  <!-- Shared layer -->
  <rect x="1120" y="130" width="420" height="480" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1330" y="165" text-anchor="middle" class="box-title">Shared Contract (shared)</text>

  <rect x="1155" y="200" width="350" height="165" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.8"/>
  <text x="1330" y="225" text-anchor="middle" class="stereo">&lt;&lt;schema&gt;&gt;</text>
  <text x="1330" y="250" text-anchor="middle" class="box-title">predictionResultSchema</text>
  <text x="1330" y="275" text-anchor="middle" class="box-text">schema.ts</text>
  <text x="1330" y="297" text-anchor="middle" class="box-text">species, confidence, phytochemicals</text>
  <text x="1330" y="319" text-anchor="middle" class="box-text">geoDistribution, metrics, confusionMatrix</text>

  <rect x="1155" y="390" width="350" height="180" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.8"/>
  <text x="1330" y="415" text-anchor="middle" class="stereo">&lt;&lt;API contract&gt;&gt;</text>
  <text x="1330" y="440" text-anchor="middle" class="box-title">api.predictions.create</text>
  <text x="1330" y="465" text-anchor="middle" class="box-text">routes.ts</text>
  <text x="1330" y="487" text-anchor="middle" class="box-text">method: POST</text>
  <text x="1330" y="509" text-anchor="middle" class="box-text">path: /api/predict</text>
  <text x="1330" y="531" text-anchor="middle" class="box-text">type: PredictionResponse</text>

  <!-- External -->
  <rect x="1120" y="665" width="420" height="245" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1330" y="700" text-anchor="middle" class="box-title">External Service</text>

  <rect x="1155" y="735" width="350" height="140" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.8"/>
  <text x="1330" y="760" text-anchor="middle" class="stereo">&lt;&lt;API&gt;&gt;</text>
  <text x="1330" y="785" text-anchor="middle" class="box-title">Google Gemini API</text>
  <text x="1330" y="810" text-anchor="middle" class="box-text">Image understanding + structured output</text>
  <text x="1330" y="832" text-anchor="middle" class="box-text">Used by analyzeWithGemini()</text>

  <!-- Edges -->
  <path class="edge" d="M485 585 L610 440"/>
  <text x="540" y="520" class="box-text">HTTP JSON</text>

  <path class="edge" d="M820 330 L820 355"/>
  <path class="edge" d="M820 525 L820 550"/>

  <path class="edge" d="M1030 430 L1155 430"/>
  <text x="1065" y="415" class="box-text">uses types</text>

  <path class="edge" d="M485 585 L1155 490"/>
  <text x="805" y="545" class="box-text">imports PredictionResponse</text>

  <path class="edge" d="M1030 635 L1155 805"/>
  <text x="1040" y="710" class="box-text">HTTPS call</text>

  <path class="edge" d="M290 325 L290 350"/>
  <path class="edge" d="M290 490 L290 515"/>
</svg>
